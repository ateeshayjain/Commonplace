name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS build (simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project iOS/Commonplace.xcodeproj \
            -scheme Commonplace \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Unit tests
        run: |
          set -o pipefail
          # The first available iPhone simulator on this runner image
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r,ds in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')))")
          xcodebuild \
            -project iOS/Commonplace.xcodeproj \
            -scheme Commonplace \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log | grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            build.log
            test.log

  edge-functions:
    name: Edge Functions typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno check
        working-directory: supabase/functions
        run: deno check _shared/*.ts */index.ts

      - name: deno test
        working-directory: supabase/functions
        run: deno test _shared/
